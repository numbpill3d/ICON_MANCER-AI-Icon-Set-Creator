    <style>
      body {
        background-color: #181614;
        color: #8A9A85;
      }
      .dotted-border {
        background-image: linear-gradient(to right, #5F6B5C 33%, rgba(255,255,255,0) 0%);
        background-position: bottom;
        background-size: 6px 1px;
        background-repeat: repeat-x;
      }
      .scanline {
        width: 100%;
        height: 100px;
        z-index: 10;
        background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(138, 154, 133, 0.1) 50%, rgba(0,0,0,0) 100%);
        opacity: 0.1;
        position: absolute;
        bottom: 100%;
        animation: scanline 10s linear infinite;
        pointer-events: none;
      }
      @keyframes scanline {
        0% { bottom: 100%; }
        100% { bottom: -100px; }
      }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f0e0c; 
      }
      ::-webkit-scrollbar-thumb {
        background: #5F6B5C; 
        border: 1px solid #181614;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #8A9A85; 
      }
    </style>
